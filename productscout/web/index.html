<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ProductScout</title>
<style>
  :root {
    --bg: #f7f8fa; --panel: #ffffff; --ink: #16181d; --muted: #6b7280;
    --line: #e4e7ec; --accent: #2563eb; --good: #15803d; --warn: #b45309; --bad: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1115; --panel:#171a21; --ink:#e8eaed; --muted:#9aa3af;
            --line:#262b35; --accent:#60a5fa; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:20px 24px; border-bottom:1px solid var(--line); background:var(--panel);
           display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  h1 { font-size:18px; margin:0; letter-spacing:-0.01em; }
  .badge { font-size:12px; color:var(--muted); border:1px solid var(--line);
           padding:2px 8px; border-radius:99px; }
  main { padding:24px; max-width:1400px; margin:0 auto; }
  .controls { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:20px; }
  input, select, button { font:inherit; padding:8px 10px; border-radius:8px;
                          border:1px solid var(--line); background:var(--panel); color:var(--ink); }
  input[type=text] { min-width:280px; }
  button { background:var(--accent); color:#fff; border:none; cursor:pointer; font-weight:600; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:500; }
  button:disabled { opacity:.55; cursor:progress; }
  label.check { display:flex; gap:6px; align-items:center; color:var(--muted); font-size:14px; }
  .wrap { overflow-x:auto; border:1px solid var(--line); border-radius:12px; background:var(--panel); }
  table { border-collapse:collapse; width:100%; min-width:980px; }
  th, td { padding:10px 12px; text-align:left; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
       position:sticky; top:0; background:var(--panel); }
  td.title { white-space:normal; min-width:280px; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:color-mix(in srgb, var(--accent) 8%, transparent); }
  .num { text-align:right; font-variant-numeric:tabular-nums; }
  .score { font-weight:700; font-variant-numeric:tabular-nums; }
  .v-perseguir { color:var(--good); } .v-investigar { color:var(--accent); }
  .v-dudoso { color:var(--warn); } .v-descartar { color:var(--muted); }
  .empty { padding:40px; text-align:center; color:var(--muted); }
  dialog { border:1px solid var(--line); border-radius:14px; background:var(--panel); color:var(--ink);
           max-width:760px; width:92vw; padding:0; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  .dhead { padding:18px 22px; border-bottom:1px solid var(--line); }
  .dbody { padding:18px 22px; max-height:70vh; overflow-y:auto; }
  .bars { display:grid; grid-template-columns:120px 1fr 48px; gap:6px 10px; align-items:center;
          margin:12px 0 20px; font-size:13px; }
  .bar { height:8px; border-radius:99px; background:var(--line); overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:4px 14px; font-size:14px; margin-bottom:16px; }
  .kv dt { color:var(--muted); } .kv dd { margin:0; font-variant-numeric:tabular-nums; }
  h3 { font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
       margin:20px 0 8px; }
  ul.notes { margin:0; padding-left:18px; } ul.notes li { margin-bottom:4px; }
  .quote { border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:14px; }
  a { color:var(--accent); }
  .status { color:var(--muted); font-size:14px; }
</style>
</head>
<body>
<header>
  <h1>ProductScout</h1>
  <span class="badge" id="sources">cargando fuentes…</span>
  <span class="status" id="status"></span>
</header>

<main>
  <div class="controls">
    <input type="text" id="keywords" placeholder="palabras clave separadas por coma">
    <input type="text" id="category" placeholder="categoría (opcional)" style="min-width:180px">
    <label class="check"><input type="checkbox" id="small" checked> solo pequeños</label>
    <label class="check">score mín. <input type="number" id="minScore" value="0" min="0" max="100" step="5" style="width:72px"></label>
    <button id="scan">Buscar</button>
    <button class="ghost" id="reload">Ver guardados</button>
  </div>

  <div class="wrap">
    <table>
      <thead><tr>
        <th>Score</th><th>Veredicto</th><th>Producto</th><th class="num">Precio</th>
        <th class="num">u/día</th><th class="num">u/mes</th><th class="num">$/mes</th>
        <th class="num">Utilidad/u</th><th class="num">ROI</th>
        <th class="num">ML pubs</th><th class="num">ML u/mes</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="11" class="empty">Corre una búsqueda para empezar.</td></tr></tbody>
    </table>
  </div>
</main>

<dialog id="detail"><div class="dhead"><strong id="dTitle"></strong></div>
  <div class="dbody" id="dBody"></div>
  <div style="padding:14px 22px; border-top:1px solid var(--line); text-align:right">
    <button class="ghost" onclick="document.getElementById('detail').close()">Cerrar</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const money = (v) => v == null ? "–" :
  "$" + Number(v).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (v) => v == null ? "–" : Math.round(v * 100) + "%";

async function loadConfig() {
  const cfg = await (await fetch("/api/config")).json();
  $("sources").textContent =
    `amazon: ${cfg.sources.amazon} · ML: ${cfg.sources.mercadolibre} (${cfg.ml_site}) · proveedores: ${cfg.sources.suppliers}`;
}

function renderRows(items) {
  const tbody = $("rows");
  if (!items.length) {
    tbody.innerHTML = '<tr><td colspan="11" class="empty">Sin resultados.</td></tr>';
    return;
  }
  tbody.innerHTML = items.map((it) => `
    <tr data-asin="${it.asin}">
      <td class="score">${it.total_score.toFixed(1)}</td>
      <td class="v-${it.verdict}">${it.verdict}</td>
      <td class="title">${it.title}<br><small style="color:var(--muted)">${it.asin} · ${it.category ?? ""}</small></td>
      <td class="num">${money(it.price)}</td>
      <td class="num">${(it.daily_units ?? 0).toFixed(1)}</td>
      <td class="num">${Math.round(it.monthly_units ?? 0)}</td>
      <td class="num">${money(it.monthly_revenue)}</td>
      <td class="num">${money(it.profit_per_unit)}</td>
      <td class="num">${pct(it.roi)}</td>
      <td class="num">${it.ml_listings ?? "–"}</td>
      <td class="num">${it.ml_monthly_units == null ? "–" : Math.round(it.ml_monthly_units)}</td>
    </tr>`).join("");
  tbody.querySelectorAll("tr[data-asin]").forEach((tr) =>
    tr.addEventListener("click", () => showDetail(tr.dataset.asin)));
}

async function showDetail(asin) {
  const p = await (await fetch(`/api/opportunities/${asin}`)).json();
  $("dTitle").textContent = p.product.title;
  const e = p.economics, m = p.ml_market;
  const bars = Object.entries(p.scores).map(([k, v]) =>
    `<span>${k}</span><span class="bar"><i style="width:${v}%"></i></span><span class="num">${v}</span>`).join("");

  $("dBody").innerHTML = `
    <div class="bars">${bars}</div>
    <dl class="kv">
      <dt>Score</dt><dd><strong>${p.total_score}</strong> → <span class="v-${p.verdict}">${p.verdict}</span></dd>
      <dt>Precio</dt><dd>${money(p.product.price)} · BSR ${p.product.bsr ?? "–"} · ${p.product.reviews_count ?? 0} reseñas · rating ${p.product.rating ?? "–"}</dd>
      <dt>Demanda Amazon</dt><dd>${p.amazon_daily_units} u/día · ${Math.round(p.amazon_monthly_units)} u/mes · ${money(p.amazon_monthly_revenue_usd)}/mes</dd>
      <dt>Tamaño</dt><dd>${p.product.weight_g ?? "?"} g · ${p.product.length_mm ?? "?"}×${p.product.width_mm ?? "?"}×${p.product.height_mm ?? "?"} mm${e ? " · " + e.size_tier : ""}</dd>
      <dt>Publicado</dt><dd>${p.product.first_available ?? "desconocido"}</dd>
      <dt>Amazon</dt><dd><a href="${p.product.url}" target="_blank" rel="noopener">ver listing</a></dd>
    </dl>
    ${m ? `<h3>Mercado Libre (${m.site}) — "${m.query}"</h3>
      <dl class="kv">
        <dt>Publicaciones</dt><dd>${m.total_listings}</dd>
        <dt>Demanda estimada</dt><dd>${Math.round(m.monthly_units_est)} u/mes (${m.sold_total} vendidas acumuladas en la muestra)</dd>
        <dt>Precio mediano</dt><dd>${m.median_price ?? "–"} ${m.currency}</dd>
        <dt>Tiendas oficiales</dt><dd>${pct(m.official_store_share)}</dd>
      </dl>` : ""}
    ${e ? `<h3>Economía unitaria (pedido de ${e.order_qty} u)</h3>
      <dl class="kv">
        <dt>Costo unitario</dt><dd>${money(e.unit_cost_usd)}</dd>
        <dt>Flete</dt><dd>${money(e.freight_usd)}</dd>
        <dt>Arancel + prep</dt><dd>${money(e.duty_usd + e.prep_usd)}</dd>
        <dt>Landed cost</dt><dd><strong>${money(e.landed_cost_usd)}</strong></dd>
        <dt>Comisión + FBA</dt><dd>${money(e.platform_fee_usd + e.fulfilment_fee_usd)}</dd>
        <dt>Utilidad/unidad</dt><dd><strong>${money(e.profit_per_unit_usd)}</strong> · margen ${pct(e.margin)} · ROI ${pct(e.roi)}</dd>
        <dt>Inversión inicial</dt><dd>${money(e.upfront_investment_usd)}</dd>
      </dl>` : ""}
    ${p.quotes?.length ? `<h3>Proveedores</h3>${p.quotes.slice(0, 5).map((q) => `
      <div class="quote"><strong>${money(q.unit_price_usd)}/u</strong> · MOQ ${q.moq} · ${q.supplier_name}
      <br><small style="color:var(--muted)">${q.years_active ?? "?"} años · rating ${q.rating ?? "?"}
      ${q.trade_assurance ? "· Trade Assurance" : ""} ${q.verified_supplier ? "· Verified" : ""}</small>
      ${q.url ? `<br><a href="${q.url}" target="_blank" rel="noopener">abrir en Alibaba</a>` : ""}</div>`).join("")}` : ""}
    ${p.alibaba_search_url ? `<p><a href="${p.alibaba_search_url}" target="_blank" rel="noopener">Buscar más proveedores en Alibaba →</a></p>` : ""}
    ${p.reasons?.length ? `<h3>A favor</h3><ul class="notes">${p.reasons.map((r) => `<li>${r}</li>`).join("")}</ul>` : ""}
    ${p.warnings?.length ? `<h3>Ojo</h3><ul class="notes">${p.warnings.map((w) => `<li>${w}</li>`).join("")}</ul>` : ""}
  `;
  $("detail").showModal();
}

async function loadSaved() {
  $("status").textContent = "cargando…";
  const data = await (await fetch("/api/opportunities?limit=100&last=true")).json();
  renderRows(data.items);
  $("status").textContent = `${data.count} guardadas`;
}

async function runScan() {
  const btn = $("scan");
  btn.disabled = true;
  $("status").textContent = "buscando… (puede tardar según la fuente)";
  try {
    const body = {
      keywords: $("keywords").value.split(",").map((s) => s.trim()).filter(Boolean),
      category: $("category").value.trim() || null,
      small_only: $("small").checked,
      min_score: Number($("minScore").value) || 0,
    };
    const res = await (await fetch("/api/scan", {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body),
    })).json();
    await loadSaved();
    $("status").textContent = `run #${res.run_id} · ${res.count} oportunidades` +
      (res.errors.length ? ` · ${res.errors.length} errores` : "");
  } catch (err) {
    $("status").textContent = "error: " + err.message;
  } finally {
    btn.disabled = false;
  }
}

$("scan").addEventListener("click", runScan);
$("reload").addEventListener("click", loadSaved);
$("keywords").addEventListener("keydown", (e) => { if (e.key === "Enter") runScan(); });
loadConfig();
loadSaved();
</script>
</body>
</html>
